slug: "go-web-services"
title: "Building RESTful Web Services with Go"
summary: "From net/http's new routing patterns to production-ready middleware: building APIs with just the standard library."
description: |
  Go 1.22 gave net/http method and wildcard routing, and for many services that's all you need.

  Emma shows how her team builds and runs payment APIs using mostly the standard library:
  - Routing with the enhanced ServeMux
  - Middleware for logging, auth and timeouts
  - Structured logging with log/slog
  - Talking to Postgres with database/sql and pgx
  - Graceful shutdown and health checks

  Doors at 18:30, food and drinks provided.
