title: "New Year Lightning Talks"
summary: "Five-minute talks from the community on anything Go. A perfect first talk, so put your name down!"
description: |
  Kick off the year with a fast-paced evening of five-minute lightning talks from members of the community.

  Anything Go-related is fair game: a library you love, a bug that bit you, a side project, a tool you built, or something you learned this year. Lightning talks are a great way to give your first talk, and organisers are happy to help you prepare.

  Want a slot? Get in touch or reply on the Meetup event.

  Food and drinks provided.
