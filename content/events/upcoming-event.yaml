id: "event-001"
slug: "go-microservices-workshop"
title: "Building Microservices with Go"
summary: "A hands-on workshop on designing and implementing microservices using Go, including patterns, best practices, and deployment strategies."
description: |
  Join us for an intensive workshop on building microservices with Go! This session will cover:
  
  - Microservice architecture patterns and when to use them
  - Designing resilient services with proper error handling
  - Inter-service communication patterns (REST, gRPC, message queues)
  - Service discovery and configuration management
  - Observability: logging, metrics, and distributed tracing
  - Containerization and deployment strategies
  - Real-world examples and case studies
  
  This is a hands-on workshop, so bring your laptop with Go installed. We'll be building actual microservices throughout the session.
  
  Prerequisites:
  - Basic Go programming knowledge
  - Understanding of web concepts (HTTP, APIs)
  - Laptop with Go 1.21+ installed
  
  Food and drinks will be provided.
