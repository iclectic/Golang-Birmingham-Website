slug: "go-concurrency-patterns"
title: "Advanced Concurrency Patterns in Go"
summary: "Pipelines, fan-out/fan-in, errgroup and context cancellation: concurrency patterns that hold up in production."
description: |
  Goroutines and channels are easy to start and surprisingly easy to get wrong.

  Mike shares the concurrency patterns that have survived years of production traffic at CloudScale, and the ones that didn't:
  - Pipelines and bounded parallelism
  - Fan-out/fan-in with errgroup
  - Cancellation and deadlines with context
  - Finding races and leaks before your users do

  Pizza from 18:30, talk at 19:00, then drinks.
