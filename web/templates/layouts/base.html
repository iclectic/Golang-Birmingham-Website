<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <meta name="description" content="{{.Description}}">
    <link rel="canonical" href="{{.CanonicalURL}}">
    <meta name="theme-color" content="#00add8">

    <meta property="og:site_name" content="{{.Site.Title}}">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{.CanonicalURL}}">
    <meta property="og:image" content="{{.BaseURL}}/static/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="{{asset "images/favicon.svg"}}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Work+Sans:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="{{asset "css/style.css"}}">
    {{with .StructuredData}}<script type="application/ld+json">{{.}}</script>{{end}}
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>
    {{template "header" .}}
    <main id="main">
        {{template "content" .}}
    </main>
    {{template "footer" .}}
    <script src="{{asset "js/main.js"}}" defer></script>
</body>
</html>
