version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - ENVIRONMENT=development
      - CONTACT_EMAIL=conduct@example.com
      - SPEAKER_FORM_URL=https://forms.example.com/speaker
      - MEETUP_URL=https://meetup.com/golang-birmingham
      - LINKEDIN_URL=https://linkedin.com/company/golang-birmingham
      - YOUTUBE_URL=https://youtube.com/@golangbirmingham
      - GITHUB_URL=https://github.com/golang-birmingham
      - CSRF_SECRET=dev-secret-change-in-production
      - SESSION_SECRET=dev-session-secret-change-in-production
      - ENABLE_HTTPS=false
    volumes:
      - ./content:/app/content:ro
      - ./web/static:/app/web/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production
